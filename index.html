<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kuis Kosakata</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        .hidden { display: none !important; }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 5px;
        }
        button:hover { background-color: #0056b3; }
        .audio-btn { background-color: #28a745; }
        .audio-btn:hover { background-color: #218838; }
        .opsi-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .opsi-btn {
            background-color: #f8f9fa;
            color: #333;
            border: 2px solid #dee2e6;
        }
        .opsi-btn:hover { background-color: #e2e6ea; }
        #kata-tampilan {
            font-size: 32px;
            font-weight: bold;
            color: #222;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Halaman Mulai (Penting untuk melewati blokir Autoplay Browser) -->
        <div id="layar-mulai">
            <h2>Game Kuis Kosakata</h2>
            <p>Dengarkan audio dan tebak artinya!</p>
            <button id="btn-mulai">Mulai Game</button>
        </div>

        <!-- Halaman Kuis Utama -->
        <div id="layar-kuis" class="hidden">
            <div id="info-progres">Pertanyaan 1/2</div>
            <div id="kata-tampilan">...</div>
            
            <button class="audio-btn" id="btn-suara">🔊 Putar Ulang Suara</button>
            
            <div class="opsi-container" id="kontainer-pilihan">
                <!-- Tombol pilihan jawaban akan muncul di sini via JS -->
            </div>
        </div>

        <!-- Halaman Skor Akhir -->
        <div id="layar-selesai" class="hidden">
            <h2>Kuis Selesai!</h2>
            <p id="skor-akhir">Skor Anda: 0</p>
            <button onclick="location.reload()">Main Lagi</button>
        </div>
    </div>

    <script>
        // DATA KUIS - Silakan ganti URL audio dengan URL GitHub Raw milik Anda sendiri
        const daftarKuis = [
            {
                kata: "Apple",
                jawabanBenar: "Apel",
                pilihan: ["Apel", "Buku", "Kucing", "Meja"],
                audioUrl: "https://githubusercontent.com"
            },
            {
                kata: "Book",
                jawabanBenar: "Buku",
                pilihan: ["Mobil", "Buku", "Pinsil", "Rumah"],
                audioUrl: "https://githubusercontent.com"
            }
        ];

        let indeksSekarang = 0;
        let skor = 0;
        let audioSekarang = null;

        const layarMulai = document.getElementById('layar-mulai');
        const layarKuis = document.getElementById('layar-kuis');
        const layarSelesai = document.getElementById('layar-selesai');
        
        // Memulai Game setelah tombol diklik (Lolos kebijakan autoplay)
        document.getElementById('btn-mulai').addEventListener('click', () => {
            layarMulai.classList.add('hidden');
            layarKuis.classList.remove('hidden');
            tampilkanKuis();
        });

        function tampilkanKuis() {
            const data = daftarKuis[indeksSekarang];
            
            // Perbarui info teks UI
            document.getElementById('info-progres').innerText = `Pertanyaan ${indeksSekarang + 1}/${daftarKuis.length}`;
            document.getElementById('kata-tampilan').innerText = data.kata;

            // Bersihkan pilihan jawaban lama
            const kontainerPilihan = document.getElementById('kontainer-pilihan');
            kontainerPilihan.innerHTML = '';

            // Buat tombol opsi pilihan secara dinamis
            data.pilihan.forEach(opsi => {
                const btn = document.createElement('button');
                btn.className = 'opsi-btn';
                btn.innerText = opsi;
                btn.onclick = () => cekJawaban(opsi);
                kontainerPilihan.appendChild(btn);
            });

            // PUTAR AUDIO OTOMATIS
            mainkanAudio(data.audioUrl);
        }

        function mainkanAudio(url) {
            if (audioSekarang) {
                audioSekarang.pause(); // Hentikan audio sebelumnya jika ada
            }
            audioSekarang = new Audio(url);
            audioSekarang.play().catch(e => console.log("Autoplay diblokir browser sebelum ada interaksi."));
        }

        // Tombol Putar Ulang Audio manual jika pengguna ingin dengar lagi
        document.getElementById('btn-suara').addEventListener('click', () => {
            if(audioSekarang) {
                audioSekarang.currentTime = 0; // Ulang dari detik ke-0
                audioSekarang.play();
            }
        });

        function cekJawaban(jawabanTerpilih) {
            const data = daftarKuis[indeksSekarang];
            if (jawabanTerpilih === data.jawabanBenar) {
                skor += 50; // Tambah skor jika benar
            }

            // Lanjut ke soal berikutnya atau selesai
            if (indeksSekarang < daftarKuis.length - 1) {
                indeksSekarang++;
                tampilkanKuis();
            } else {
                layarKuis.classList.add('hidden');
                layarSelesai.classList.remove('hidden');
                document.getElementById('skor-akhir').innerText = `Skor Akhir Anda: ${skor}`;
            }
        }
    </script>
</body>
</html>
