<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bahasa Jepang</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f8fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .question {
            text-align: center;
            font-size: 38px;
            font-weight: bold;
            margin: 30px 0 15px;
        }

        .meaning {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .audio-button {
            display: block;
            margin: 0 auto 25px;
            border: none;
            background: #2c7be5;
            color: white;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .audio-button:hover {
            opacity: 0.9;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        .answer:hover {
            background: #f1f5ff;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            min-height: 25px;
        }

        .next-button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>

<div class="quiz-container">

    <h1>Quiz Bahasa Jepang</h1>

    <div class="question">
        じてんしゃ
    </div>

    <div class="meaning">
        Dengarkan audio lalu pilih arti yang benar.
    </div>

    <button class="audio-button" onclick="putarAudio()">
        🔊 Dengarkan
    </button>

    <audio id="audioJepang" preload="auto">
        <source src="じてんしゃ.mp3" type="audio/mpeg">
    </audio>

    <div class="answers">

        <button class="answer" onclick="jawab(1)">
            A. Mobil
        </button>

        <button class="answer" onclick="jawab(2)">
            B. Sepeda
        </button>

        <button class="answer" onclick="jawab(3)">
            C. Kereta
        </button>

        <button class="answer" onclick="jawab(4)">
            D. Pesawat
        </button>

    </div>

    <div id="result" class="result"></div>

    <button id="nextButton" class="next-button" onclick="soalBerikutnya()">
        Soal Berikutnya
    </button>

</div>


<script>

    // ==========================
    // AUDIO
    // ==========================

    const audioJepang = document.getElementById("audioJepang");

    function putarAudio() {

        audioJepang.currentTime = 0;

        audioJepang.play().catch(function(error) {
            console.log("Audio tidak dapat diputar:", error);
        });

    }


    // ==========================
    // JAWABAN
    // ==========================

    function jawab(pilihan) {

        const result = document.getElementById("result");
        const nextButton = document.getElementById("nextButton");

        // Jawaban yang benar adalah B
        if (pilihan === 2) {

            result.textContent = "✓ Benar! じてんしゃ berarti sepeda.";

        } else {

            result.textContent = "✗ Salah. Jawaban yang benar adalah B. Sepeda.";

        }

        // Matikan semua tombol setelah menjawab
        const buttons = document.querySelectorAll(".answer");

        buttons.forEach(function(button) {
            button.disabled = true;
            button.style.cursor = "default";
        });

        nextButton.style.display = "block";
    }


    // ==========================
    // SOAL BERIKUTNYA
    // ==========================

    function soalBerikutnya() {

        alert("Nanti di sini bisa dimasukkan soal berikutnya.");

    }

</script>

</body>
</html>
